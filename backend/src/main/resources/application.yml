server:
  # 后端 HTTP 端口。个人本地可通过 application-local.yml 覆盖为 SERVER_PORT=8081 等
  # 生产部署通过环境变量 SERVER_PORT 覆盖
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: recruitment-system
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: is_deleted

jwt:
  # 占位符：默认 ≥32 字符（JJWT 0.12.x 要求 HMAC-SHA 密钥 ≥256 bits = 32 bytes）
  # 生产部署请通过环境变量 JWT_SECRET 覆盖为强随机字符串
  secret: ${JWT_SECRET:dev-secret-please-change-in-production-with-32-chars}
  expire-hours: ${JWT_EXPIRE_HOURS:24}

llm:
  # 默认指向 MiniMax（与 docs/技术约束.md §6 兼容 OpenAI Chat Completions 协议）
  # 切换服务商时仅修改下方三个字段即可，代码中无硬编码
  api-url: ${LLM_API_URL:https://api.minimax.cn/v1/chat/completions}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:MiniMax-M3}
  timeout-seconds: 30
  # v0.6 AI-4 智能客服专用配置
  # chat-model 默认与 model 相同；如需更快首字速度，设置环境变量 LLM_CHAT_MODEL=qwen-turbo
  chat-model: ${LLM_CHAT_MODEL:}
  chat-max-tokens: 600

app:
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from-address: ${APP_MAIL_FROM:}
    from-name: ${APP_MAIL_NAME:招聘系统}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
